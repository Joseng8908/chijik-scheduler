apiVersion: v1
kind: ServiceAccount
metadata:
  name: chijik-scheduler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chijik-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler
subjects:
  - kind: ServiceAccount
    name: chijik-scheduler
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chijik-scheduler-plugins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler:plugins
subjects:
  - kind: ServiceAccount
    name: chijik-scheduler
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chijik-scheduler-config
  namespace: kube-system
data:
  chijik-scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: false
    profiles:
      - schedulerName: chijik-scheduler
        plugins:
          preEnqueue:
            enabled:
              - name: PredictiveEnqueue
          filter:
            enabled:
              - name: TranscoderFilter
          score:
            enabled:
              - name: BandwidthScore
                weight: 10
              - name: StreamAffinity
                weight: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chijik-scheduler
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      component: chijik-scheduler
  template:
    metadata:
      labels:
        component: chijik-scheduler
    spec:
      serviceAccountName: chijik-scheduler
      nodeName: benchmark-control-plane
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: chijik-scheduler
          image: chijik-scheduler:latest
          imagePullPolicy: Never
          args:
            - --config=/etc/kubernetes/chijik-scheduler-config.yaml
            - --v=5
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes
      volumes:
        - name: config
          configMap:
            name: chijik-scheduler-config
